<script>

document.getElementById("profileImage").addEventListener("change", function(event){

let file = event.target.files[0];

if(file){

let reader = new FileReader();

reader.onload = function(e){

let preview = document.getElementById("previewImage");

preview.src = e.target.result;

preview.style.display = "block";

};

reader.readAsDataURL(file);

}

});

</script>
<script>

let imageInput = document.getElementById("profileImage");

let preview = document.getElementById("previewImage");

let removeBtn = document.getElementById("removeImageBtn");


// Show preview when image selected

imageInput.addEventListener("change", function(event){

let file = event.target.files[0];

if(file){

let reader = new FileReader();

reader.onload = function(e){

preview.src = e.target.result;

preview.style.display = "block";

removeBtn.style.display = "inline-block";

};

reader.readAsDataURL(file);

}

});


// Remove image when button clicked

removeBtn.addEventListener("click", function(){

preview.src = "";

preview.style.display = "none";

imageInput.value = "";

removeBtn.style.display = "none";

});

</script>

<script>

function submitApplication(){

// Get internship role
let roleElement = document.getElementById("internshipTitle");

if(!roleElement){
alert("Internship title not found");
return;
}

let role = roleElement.innerText;


// Get form values

let name = document.getElementById("userName").value;

let email = document.getElementById("email").value;

let company = document.getElementById("company").value;

let location = document.getElementById("location").value;

let imageElement = document.getElementById("previewImage");

let profileImage = imageElement ? imageElement.src : "";


// Validate required fields

if(name === "" || email === ""){
alert("Please fill all required fields");
return;
}


// Save data

localStorage.setItem("applicationForm",
JSON.stringify({
role: role,
name: name,
email: email,
company: company,
location: location
}));


// Save profile image

localStorage.setItem("profileImage", profileImage);


// Redirect

window.location.href = "success.html";

}

<script>

function submitApplication(){

let role =
document.getElementById("internshipTitle").innerText;

let name =
document.getElementById("userName").value;

let dob = 
document.getElementById("dob").value;

let email =
document.getElementById("email").value;

let company =
document.getElementById("company").value;

let location =
document.getElementById("location").value;

let profileImage =
document.getElementById("previewImage").src;


// store latest application (for PDF)

localStorage.setItem("applicationForm",
JSON.stringify({role,name,dob,email,company,location}));


// store multiple applications

let allApplications =
JSON.parse(localStorage.getItem("allApplications")) || [];

allApplications.push({
role,
name,
email,
company,
location,
profileImage
});

localStorage.setItem("allApplications",
JSON.stringify(allApplications));


// store image separately for PDF

localStorage.setItem("profileImage", profileImage);


window.location.href="success.html";

}

</script>
